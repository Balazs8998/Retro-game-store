@if (snakeSelectedAction() === 'Menu'){
  <app-snake-menu
    (exitSnake)="exit()"
    (selectedAction)="selectedAction($event)"
  ></app-snake-menu>
} @else if (snakeSelectedAction() === 'Start Game'){
  <app-snake-game-play
  (exitToSnakeMenu)="backToSnakeMenu()"
  ></app-snake-game-play>
} @else if (snakeSelectedAction() === 'Settings'){
  <app-snake-game-settings
  (backOutput)="backToSnakeMenu()"
  >
  </app-snake-game-settings>
}
